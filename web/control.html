<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreBall · 调试台</title>
<style>
  :root { color-scheme: dark; --line:#1d2732; --panel:#10161d; --ink:#dfe7ef; --dim:#7d8a99; }
  html, body { height: 100%; }
  body { margin: 0; background: #0a0e12; color: var(--ink);
         font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: #0d131a; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .06em; margin: 0 8px 0 0; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #55606c; }
  #dot.on { background: #46c98b; box-shadow: 0 0 8px #46c98b; }
  #dot.warn { background: #e0b060; box-shadow: 0 0 8px #e0b060; }
  #dot.off { background: #d9534f; }
  #link { font-size: 12px; color: var(--dim); }
  .spacer { flex: 1; }
  button, a.btn { background: #17202a; color: #cfdae6; border: 1px solid #263242;
                  border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit;
                  text-decoration: none; }
  button:hover, a.btn:hover { background: #1d2937; }
  button.on { background: #2a6f8f; border-color: #3d92b8; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 336px; }
  #stage { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #rig3d { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
           background: #0a0e12; display: none; }
  #stage.rig #rig3d { display: block; }
  #stage.rig #cv, #stage.rig #banner, #stage.rig #hint { display: none; }
  .ball3d { width: 100%; height: 228px; border: 1px solid #1a242e; border-radius: 10px;
            background: #0b1016; display: block; }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--dim);
          font-size: 12px; pointer-events: none; }
  #banner { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
            color: #8b9aab; font-size: 13px; text-align: center; pointer-events: none;
            background: rgba(10,14,18,.72); border: 1px solid #1d2732; border-radius: 10px;
            padding: 12px 18px; display: none; white-space: pre-line; }
  aside { border-left: 1px solid var(--line); background: var(--panel);
          padding: 12px; overflow: auto; }
  .group { margin-bottom: 14px; }
  .group h3 { font-size: 11px; letter-spacing: .12em; color: #6f7f90;
              margin: 0 0 7px; font-weight: 600; text-transform: uppercase; }
  .group h3 .val { float: right; text-transform: none; letter-spacing: 0; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dpad button { height: 38px; padding: 0; }
  .dpad button.held { background: #2a6f8f; border-color: #3d92b8; color: #fff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1; min-width: 62px; }
  .row.two button { min-width: 0; }
  .kv { display: flex; justify-content: space-between; gap: 10px;
        font: 12px/1.9 ui-monospace, Consolas, monospace; color: var(--dim); }
  .kv b { color: #b7c7d6; font-weight: 500; text-align: right; }
  .kv b.bad { color: #e0716c; }
  .kv b.good { color: #63c79a; }
  #ropes { display: grid; gap: 3px; margin: 4px 0 6px; }
  .rope { display: grid; grid-template-columns: 26px 1fr 58px; align-items: center;
          gap: 6px; font: 11.5px ui-monospace, Consolas, monospace; color: var(--dim); }
  .rope i { height: 5px; background: #1a242e; border-radius: 3px; overflow: hidden; }
  .rope i b { display: block; height: 100%; background: #4fa87f; border-radius: 3px; }
  .rope em { font-style: normal; text-align: right; color: #9fb0c2; }
  input[type=range] { width: 100%; accent-color: #4fa87f; }
  .hrow { display: grid; grid-template-columns: 34px 1fr 42px; align-items: center;
          gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .hrow span { text-align: right; font: 12px ui-monospace, Consolas, monospace; }
  #log { height: 118px; overflow: auto; background: #0b1016; border: 1px solid #1a242e;
         border-radius: 8px; padding: 7px 9px; font: 11.5px/1.55 ui-monospace, Consolas, monospace;
         color: #8b9aab; white-space: pre-wrap; }
  #log a, .group h3 a { color: #6497b8; text-decoration: none; font-size: 11px; }
  #log a:hover, .group h3 a:hover { text-decoration: underline; }
  .links { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 48vh; }
  }
</style>
</head>
<body>
<header>
  <h1>CoreBall · 调试台</h1>
  <span id="dot" title="调试连接状态"></span>
  <span id="link">未连接</span>
  <button id="mode">斜视图</button>
  <button id="rig">3D 工位</button>
  <span class="spacer"></span>
  <a class="btn" href="command.html">3D 指挥</a>
  <a class="btn" href="viewer.html">模型查看</a>
</header>

<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <iframe id="rig3d" title="3D 工位"></iframe>
    <div id="hint">按住 W/A/S/D 平移 · Q/E 升降 · 松开即停 ｜ 点地面定位 ｜ 空格停</div>
    <div id="banner"></div>
  </section>

  <aside>
    <div class="group">
      <h3>球模块 <span class="val" id="ballmode">3D 预览</span></h3>
      <iframe id="ball3d" class="ball3d" src="viewer.html?embed=1&model=ball" title="3D 球模块"></iframe>
    </div>
    <div class="group">
      <h3>手动 <span class="val" id="speedv">240 mm/s</span></h3>
      <input id="speed" type="range" min="80" max="400" step="20" value="240">
      <div class="dpad" style="margin-top:6px">
        <span></span><button data-jog="w">W 前</button><span></span>
        <button data-jog="a">A 左</button><button data-intent="stop">停</button><button data-jog="d">D 右</button>
        <span></span><button data-jog="s">S 后</button><span></span>
      </div>
      <div class="row two" style="margin-top:6px">
        <button data-jog="q">Q 降</button>
        <button data-jog="e">E 升</button>
      </div>
    </div>

    <div class="group">
      <h3>实时状态</h3>
      <div class="kv"><span>球</span><b id="ball">—</b></div>
      <div class="kv"><span>吊点</span><b id="hub">—</b></div>
      <div class="kv"><span>目标</span><b id="tgt">—</b></div>
      <div class="kv"><span>安全修正</span><b id="req">—</b></div>
      <div class="kv"><span>遥测</span><b id="age">—</b></div>
      <div class="kv"><span>指令</span><b id="last">—</b></div>
    </div>

    <div class="group">
      <h3>绳索 <span class="val" id="support">—</span></h3>
      <div id="ropes"></div>
      <div class="kv"><span>最松</span><b id="margin">—</b></div>
      <div class="kv"><span>力封闭</span><b id="closed">—</b></div>
      <div class="kv"><span>安全层</span><b id="blocked">—</b></div>
    </div>

    <div class="group">
      <h3>预设</h3>
      <div class="row">
        <button data-intent="come">过来</button>
        <button data-intent="back">回去</button>
        <button data-intent="look">看我</button>
      </div>
      <div class="row two" style="margin-top:6px">
        <button data-intent="up">升 120</button>
        <button data-intent="down">降 120</button>
        <button data-intent="left">左 120</button>
        <button data-intent="right">右 120</button>
      </div>
      <label class="hrow">高度 <input id="z" type="range" min="900" max="1500" step="5" value="1300"><span id="zv">1300</span></label>
    </div>

    <div class="group">
      <h3>表情</h3>
      <div class="row">
        <button data-expr="idle" class="on">待命</button>
        <button data-expr="listening">在听</button>
        <button data-expr="acting">执行</button>
      </div>
    </div>

    <div class="group">
      <h3>日志 <span class="links"><a href="#" id="export">导出</a><a href="#" id="clear">清空</a></span></h3>
      <div id="log"></div>
    </div>
  </aside>
</main>

<script id="console-core">
// ===== 纯逻辑：无 DOM 依赖，测试从这里加载 =====
const KEY_DIR = {
  w: [0, -1, 0], s: [0, 1, 0],
  a: [-1, 0, 0], d: [1, 0, 0],
  q: [0, 0, -1], e: [0, 0, 1],
};
const MAX_SPEED = 400;
const MIN_SPEED = 80;

// 参数默认值与 tools/tension.py 一致；web/params.json 存在时由 applyParams 覆盖
const PARAMS = {
  anchors: null,   // null → app 用内置 FALLBACK_ANCHORS
  tMin: 0.30,
  neck: { x: 0, y: 890, r: 210 },
  floor: { x: 775, y0: 250, y1: 1055 },
};

function applyParams(p) {
  if (!p || typeof p !== 'object') return false;
  if (Array.isArray(p.anchors) && p.anchors.length === 8) PARAMS.anchors = p.anchors;
  if (p.t_min > 0) PARAMS.tMin = Number(p.t_min);
  if (p.neck) Object.assign(PARAMS.neck, p.neck);
  if (p.booth) {
    const m = (p.booth.ball_r || 40) + (p.booth.gap || 5);
    PARAMS.floor = {
      x: (p.booth.hx || 820) - m,
      y0: Math.max(p.booth.y0p || 250, (p.booth.y0 || 0) + m),
      y1: (p.booth.y1 || 1100) - m,
    };
  }
  return true;
}

function jogVector(keys, speed) {
  speed = Math.max(0, Math.min(MAX_SPEED, Number(speed) || 0));
  let v = [0, 0, 0];
  for (const k of keys) {
    const d = KEY_DIR[k];
    if (!d) continue;
    v[0] += d[0]; v[1] += d[1]; v[2] += d[2];
  }
  const n = Math.hypot(v[0], v[1], v[2]);
  if (n < 1e-9 || speed === 0) return [0, 0, 0];
  return v.map(x => x * speed / n);
}

function clampFloor(x, y) {
  return [Math.max(-PARAMS.floor.x, Math.min(PARAMS.floor.x, x)),
          Math.max(PARAMS.floor.y0, Math.min(PARAMS.floor.y1, y))];
}

globalThis.ConsoleCore = { KEY_DIR, MAX_SPEED, MIN_SPEED, jogVector, clampFloor, PARAMS, applyParams };
</script>

<script>
// ===== 应用：绘制、遥测、键盘 / 按钮操控 =====
(() => {
const { jogVector, clampFloor, PARAMS } = ConsoleCore;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dot = document.getElementById('dot');
const linkEl = document.getElementById('link');
const banner = document.getElementById('banner');
const speedEl = document.getElementById('speed');
const speedV = document.getElementById('speedv');
const zEl = document.getElementById('z');
const zv = document.getElementById('zv');
const logEl = document.getElementById('log');
const ball3d = document.getElementById('ball3d');
const rig3d = document.getElementById('rig3d');
const rigBtn = document.getElementById('rig');
let rigOn = false, rigLoaded = false;

const NEAR = [-380, 520, 1300];
const HOME = [-430, 760, 1420];
const ROVER_NEAR = [-450, 650, 0];
const ROVER_HOME = [600, 250, 0];
const FALLBACK_ANCHORS = [
  [-760, 12, 1849], [780, 1100, 1760], [-300, 12, 1849], [-780, 1100, 1760],
  [760, 12, 1670], [-808, 200, 1849], [808, 500, 1760], [808, 800, 1760],
];
const state = {
  mode: '2d',
  tele: null,
  target: null,
  z: 1300,
  speed: 240,
  zDrag: false,
  lastLink: '',
  lastIntent: '',
};

const keys = new Set();
let jogWasOn = false;

// ---------------- 日志 ----------------
const logs = [];
function log(text) {
  const now = new Date();
  logs.push({ at: now, text });
  if (logs.length > 400) logs.shift();
  renderLog();
}
function renderLog() {
  logEl.textContent = logs.slice(-160).map(e =>
    e.at.toLocaleTimeString() + '  ' + e.text).join('\n');
  logEl.scrollTop = logEl.scrollHeight;
}
function exportLog() {
  const body = logs.map(e => e.at.toISOString() + '  ' + e.text).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/plain' }));
  a.download = 'coreball-debug-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------- 视图 ----------------
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paint();
}
window.addEventListener('resize', fit);

function view() {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (state.mode === '2d') {
    const k = Math.min(W / 1900, H / 1300);
    return { k, cx: W / 2, cy: H / 2, iso: false };
  }
  const k = Math.min(W / 2100, H / 2600);
  return { k, cx: W / 2, cy: H * 0.86, iso: true };
}

function proj(x, y, z) {
  const v = view();
  if (!v.iso) return [v.cx + x * v.k, v.cy + (y - 550) * v.k];
  return [v.cx + (x - 0.6 * y) * v.k, v.cy + (y * 0.35 - z) * v.k];
}

function unproject(sx, sy) {
  const v = view();
  if (!v.iso) return [(sx - v.cx) / v.k, (sy - v.cy) / v.k + 550];
  const y = (sy - v.cy) / (0.35 * v.k);
  const x = (sx - v.cx) / v.k + 0.6 * y;
  return [x, y];
}

function poly(pts, fill, stroke) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function cableColor(margin) {
  if (margin == null) return '#5f6f7c';
  if (margin >= 1.0) return '#4fa87f';
  if (margin >= PARAMS.tMin) return '#e0b060';
  return '#d9534f';
}

function anchorsNow() {
  const a = state.tele && state.tele.anchors;
  return (a && a.length) ? a : (PARAMS.anchors || FALLBACK_ANCHORS);
}

function paint() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0e12';
  ctx.fillRect(0, 0, W, H);

  // 地面网格
  ctx.strokeStyle = '#121a22';
  ctx.lineWidth = 1;
  for (let x = -800; x <= 800; x += 200) {
    const a = proj(x, 0, 0), b = proj(x, 1100, 0);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  for (let y = 0; y <= 1100; y += 100) {
    const a = proj(-820, y, 0), b = proj(820, y, 0);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  poly([proj(-820, 0, 0), proj(820, 0, 0), proj(820, 1100, 0), proj(-820, 1100, 0)],
       'rgba(30,40,50,.35)', '#263543');

  // 三面围板
  const WH = 1900;
  if (state.mode === '2d') {
    ctx.strokeStyle = '#3a4b5c'; ctx.lineWidth = 4;
    [[[-820, 0], [-820, 1100]], [[820, 0], [820, 1100]], [[-820, 0], [820, 0]]]
      .forEach(([a, b]) => {
        const p0 = proj(a[0], a[1], 0), p1 = proj(b[0], b[1], 0);
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      });
    ctx.setLineDash([7, 7]); ctx.strokeStyle = '#2a3743';
    const f0 = proj(-820, 1100, 0), f1 = proj(820, 1100, 0);
    ctx.beginPath(); ctx.moveTo(f0[0], f0[1]); ctx.lineTo(f1[0], f1[1]); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    const fill = 'rgba(45,62,78,.22)', edge = '#3a4b5c';
    poly([proj(-820, 0, 0), proj(820, 0, 0), proj(820, 0, WH), proj(-820, 0, WH)], fill, edge);
    poly([proj(-820, 0, 0), proj(-820, 1100, 0), proj(-820, 1100, WH), proj(-820, 0, WH)], fill, edge);
    poly([proj(820, 0, 0), proj(820, 1100, 0), proj(820, 1100, WH), proj(820, 0, WH)], fill, edge);
    ctx.setLineDash([7, 7]); ctx.strokeStyle = '#2a3743';
    const f0 = proj(-820, 1100, 0), f1 = proj(820, 1100, 0);
    ctx.beginPath(); ctx.moveTo(f0[0], f0[1]); ctx.lineTo(f1[0], f1[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 桌子
  const dx = 780, dy1 = 20, dy2 = 720, dz = 740;
  if (state.mode === '2d') {
    poly([proj(-dx, dy1, 0), proj(dx, dy1, 0), proj(dx, dy2, 0), proj(-dx, dy2, 0)],
         'rgba(120,100,80,.25)', '#4a4036');
  } else {
    poly([proj(-dx, dy1, dz), proj(dx, dy1, dz), proj(dx, dy2, dz), proj(-dx, dy2, dz)],
         'rgba(120,100,80,.35)', '#6a5a48');
    [[-dx, dy1], [dx, dy1], [dx, dy2], [-dx, dy2]].forEach(([x, y]) => {
      const a = proj(x, y, 0), b = proj(x, y, dz);
      ctx.strokeStyle = '#3a322a'; ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    });
  }

  // 脖子禁区
  const NX = PARAMS.neck.x, NY = PARAMS.neck.y, NR = PARAMS.neck.r;
  if (state.mode === '2d') {
    const c = proj(NX, NY, 0);
    ctx.beginPath(); ctx.arc(c[0], c[1], NR * view().k, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,70,60,.12)'; ctx.strokeStyle = 'rgba(200,70,60,.65)';
    ctx.fill(); ctx.stroke();
  } else {
    const v = view(), c0 = proj(NX, NY, 0);
    [0, WH].forEach(z => {
      const c = proj(NX, NY, z);
      ctx.beginPath(); ctx.ellipse(c[0], c[1], NR * v.k, NR * 0.35 * v.k, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200,70,60,.6)'; ctx.stroke();
    });
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
      const x = NX + Math.cos(a) * NR, y = NY + Math.sin(a) * NR;
      const p0 = proj(x, y, 0), p1 = proj(x, y, WH);
      ctx.strokeStyle = 'rgba(200,70,60,.25)';
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    }
  }

  const tele = state.tele;
  const anchors = anchorsNow();
  const support = (tele && tele.support) || [];
  const hub = tele && tele.hub ? tele.hub : null;
  const ball = tele && tele.ball ? tele.ball : null;

  // 绳
  if (hub) {
    anchors.forEach((a, i) => {
      const active = support.includes(i);
      if (!active) return;
      const p0 = proj(a[0], a[1], a[2]);
      const p1 = proj(hub[0], hub[1], hub[2]);
      ctx.strokeStyle = cableColor(tele.margin);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    });
  }

  // 锚点
  anchors.forEach((a, i) => {
    const p = proj(a[0], a[1], a[2]);
    const active = support.includes(i);
    ctx.beginPath(); ctx.arc(p[0], p[1], active ? 4 : 2.6, 0, Math.PI * 2);
    ctx.fillStyle = active ? '#8fa3b5' : '#3b4a58';
    ctx.fill();
    if (active) {
      ctx.fillStyle = '#7d8a99';
      ctx.font = '10px Consolas, monospace';
      ctx.fillText('A' + (i + 1), p[0] + 6, p[1] - 4);
    }
  });

  // 球 / 吊点
  if (ball) {
    const z = state.mode === '2d' ? 0 : ball[2];
    const bp = proj(ball[0], ball[1], z);
    const r = Math.max(6, 40 * view().k);
    if (state.mode === '3d') {
      const f = proj(ball[0], ball[1], 0);
      ctx.strokeStyle = 'rgba(140,200,240,.22)';
      ctx.beginPath(); ctx.moveTo(bp[0], bp[1]); ctx.lineTo(f[0], f[1]); ctx.stroke();
      if (hub) {
        const hp = proj(hub[0], hub[1], hub[2]);
        ctx.strokeStyle = 'rgba(180,200,220,.45)';
        ctx.beginPath(); ctx.moveTo(bp[0], bp[1]); ctx.lineTo(hp[0], hp[1]); ctx.stroke();
        ctx.beginPath(); ctx.arc(hp[0], hp[1], 4, 0, Math.PI * 2);
        ctx.fillStyle = '#9fb0c2'; ctx.fill();
      }
    } else if (hub) {
      ctx.beginPath(); ctx.arc(bp[0], bp[1], r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(159,176,194,.35)'; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(bp[0], bp[1], r, 0, Math.PI * 2);
    ctx.fillStyle = tele.stale ? '#a9a2a0' : '#cfe3f0';
    ctx.fill();
    ctx.strokeStyle = tele.blocked ? '#d9534f' : (tele.stale ? '#e0b060' : '#4f9fcf');
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#9fb0c2';
    ctx.font = '12px "Microsoft YaHei"';
    ctx.fillText(tele.body === 'winch' ? '球' : '小车', bp[0] + r + 5, bp[1] + 4);
  }

  // 目标十字
  if (state.target) {
    const t = proj(state.target[0], state.target[1],
                   state.mode === '2d' ? 0 : state.target[2]);
    ctx.strokeStyle = '#e0b060'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(t[0] - 7, t[1]); ctx.lineTo(t[0] + 7, t[1]);
    ctx.moveTo(t[0], t[1] - 7); ctx.lineTo(t[0], t[1] + 7);
    ctx.stroke();
  }

  banner.style.display = tele ? 'none' : 'block';
  banner.textContent = '等待 Blender 遥测…\n先开「指挥.bat」，再运行 tools/control_server.py';
}

// ---------------- 遥测 ----------------
function post3D(t) {
  if (!t) return;
  try {
    if (ball3d.contentWindow)
      ball3d.contentWindow.postMessage({ type: 'ball', expr: t.expr, yaw: t.yaw }, '*');
    if (rig3d.contentWindow)
      rig3d.contentWindow.postMessage({ type: 'telemetry', data: t }, '*');
  } catch (_) {}
}

function setRig(on) {
  rigOn = on;
  document.getElementById('stage').classList.toggle('rig', on);
  rigBtn.classList.toggle('on', on);
  rigBtn.textContent = on ? '2D 地图' : '3D 工位';
  if (on) {
    if (!rigLoaded) {
      rig3d.src = 'viewer.html?embed=1&debug=rig';
      rigLoaded = true;
    }
    post3D(state.tele);
  } else {
    paint();
  }
}

rigBtn.addEventListener('click', () => setRig(!rigOn));
rig3d.addEventListener('load', () => post3D(state.tele));
ball3d.addEventListener('load', () => post3D(state.tele));

function setLink(kind, text) {
  dot.className = kind;
  linkEl.textContent = text;
  if (state.lastLink !== kind + text) {
    state.lastLink = kind + text;
    if (kind === 'off') log('未连接：控制桥或 Blender 没启动');
    else if (kind === 'warn') log('遥测超时：Blender 可能卡住或被关掉');
    else log('已连接：收到实时遥测');
  }
}

async function poll() {
  try {
    const r = await fetch('/state', { cache: 'no-store' });
    const j = await r.json();
    if (j.ok) {
      state.tele = j;
      setLink(j.stale ? 'warn' : 'on', j.stale ? '遥测超时' : '实时');
      post3D(j);
      if (!state.zDrag && j.ball) {
        state.z = j.ball[2];
        zEl.value = Math.round(state.z);
        zv.textContent = Math.round(state.z);
      }
    } else {
      state.tele = null;
      setLink('off', '未连接');
    }
  } catch (e) {
    state.tele = null;
    setLink('off', '未连接');
  }
  renderPanel();
  paint();
}
setInterval(poll, 100);

function fmtVec(p) {
  return p ? p.map(v => Math.round(v)).join(', ') : '—';
}

function renderPanel() {
  const t = state.tele;
  document.getElementById('ball').textContent = fmtVec(t && t.ball);
  document.getElementById('hub').textContent = fmtVec(t && t.hub);
  document.getElementById('tgt').textContent = fmtVec(state.target);
  const req = document.getElementById('req');
  req.textContent = (t && t.requested) ? fmtVec(t.requested) + ' → 已夹取' : '—';
  req.className = (t && t.requested) ? 'bad' : '';
  const age = document.getElementById('age');
  age.textContent = t ? (t.age_ms + ' ms' + (t.stale ? '（超时）' : '')) : '—';
  age.className = t ? (t.stale ? 'bad' : 'good') : '';
  document.getElementById('last').textContent = (t && t.last) || '—';

  const support = (t && t.support) || [];
  const names = (t && t.support_names) || [];
  document.getElementById('support').textContent = names.length ? names.join(' ') : '—';

  const ropes = document.getElementById('ropes');
  const tensions = (t && t.tensions) || [];
  const frag = document.createDocumentFragment();
  support.forEach((idx, k) => {
    const ten = Number(tensions[k] || 0);
    const row = document.createElement('div');
    row.className = 'rope';
    const name = document.createElement('span');
    name.textContent = 'A' + (idx + 1);
    const bar = document.createElement('i');
    const fill = document.createElement('b');
    fill.style.width = Math.max(2, Math.min(100, ten / 4 * 100)) + '%';
    fill.style.background = cableColor(ten);
    bar.appendChild(fill);
    const val = document.createElement('em');
    val.textContent = ten.toFixed(2) + ' N';
    row.append(name, bar, val);
    frag.appendChild(row);
  });
  ropes.replaceChildren(frag);

  const margin = document.getElementById('margin');
  margin.textContent = t && t.margin != null ? t.margin.toFixed(2) + ' N' : '—';
  margin.className = t && t.margin != null ? (t.margin >= PARAMS.tMin ? 'good' : 'bad') : '';

  const closed = document.getElementById('closed');
  closed.textContent = t && t.closed != null ? (t.closed ? 'OK' : '失效') : '—';
  closed.className = t && t.closed === false ? 'bad' : (t && t.closed ? 'good' : '');

  const blocked = document.getElementById('blocked');
  blocked.textContent = t ? (t.blocked ? '否决：目标在禁区内' : '放行') : '—';
  blocked.className = t && t.blocked ? 'bad' : '';

  document.querySelectorAll('button[data-expr]').forEach(b =>
    b.classList.toggle('on', !!t && b.dataset.expr === t.expr));
}

// ---------------- 发送 ----------------
function markSend(ok) {
  if (!ok) setLink('off', '发送失败');
}

async function sendIntent(msg, label, quiet = false) {
  if (msg.intent !== 'goto') state.target = null;
  try {
    const r = await fetch('/intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(msg),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    markSend(true);
    if (!quiet) log(label || msg.intent);
  } catch (e) {
    markSend(false);
    if (!quiet) log('发送失败：' + e.message + '（先开 Blender 指挥场景）');
  }
}

function sendGoto(p, label) {
  const xy = clampFloor(p[0], p[1]);
  const q = [xy[0], xy[1], p[2]];
  state.target = q.slice();
  sendIntent({ intent: 'goto', point: q }, label || ('去 ' + fmtVec(q)));
}

// ---------------- 手动 jog ----------------
function jogTick() {
  const v = jogVector(keys, state.speed);
  const active = v.some(x => x !== 0);
  if (!active && !jogWasOn) return;
  const t = state.tele;
  if (!t || t.stale || t.body !== 'winch') {
    jogWasOn = false;
    return;
  }
  sendIntent({ intent: 'jog', v }, null, true);
  jogWasOn = active;
}
setInterval(jogTick, 50);

function setKey(k, down) {
  if (down) keys.add(k); else keys.delete(k);
  document.querySelectorAll('button[data-jog="' + k + '"]').forEach(b =>
    b.classList.toggle('held', down));
}

// 键盘
const TYPING = ['INPUT', 'TEXTAREA', 'SELECT'];
window.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (ae && TYPING.includes(ae.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === ' ') {
    e.preventDefault();
    keys.clear();
    jugButtons(false);
    sendIntent({ intent: 'stop' }, '停');
    return;
  }
  if (ConsoleCore.KEY_DIR[k]) {
    e.preventDefault();
    setKey(k, true);
  }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (ConsoleCore.KEY_DIR[k]) {
    e.preventDefault();
    setKey(k, false);
  }
});
window.addEventListener('blur', () => { keys.clear(); jugButtons(false); });

function jugButtons(on) {
  document.querySelectorAll('button[data-jog]').forEach(b =>
    b.classList.toggle('held', on));
}

// 按住按钮 = 按住方向键
document.querySelectorAll('button[data-jog]').forEach(b => {
  const k = b.dataset.jog;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    b.setPointerCapture(e.pointerId);
    setKey(k, true);
  });
  const up = e => {
    try { b.releasePointerCapture(e.pointerId); } catch (_) {}
    setKey(k, false);
  };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
});

document.querySelectorAll('button[data-intent]').forEach(b => {
  b.addEventListener('click', () => {
    const name = b.dataset.intent;
    if (name === 'stop') { keys.clear(); jugButtons(false); }
    sendIntent({ intent: name });
  });
});

document.querySelectorAll('button[data-expr]').forEach(b => {
  b.addEventListener('click', () => {
    sendIntent({ intent: 'expression', name: b.dataset.expr }, '表情 ' + b.dataset.expr);
  });
});

speedEl.addEventListener('input', () => {
  state.speed = Number(speedEl.value);
  speedV.textContent = state.speed + ' mm/s';
});

zEl.addEventListener('input', () => {
  state.zDrag = true;
  state.z = Number(zEl.value);
  zv.textContent = state.z;
});
zEl.addEventListener('change', () => {
  state.zDrag = false;
  const base = (state.tele && state.tele.ball) || NEAR;
  sendGoto([base[0], base[1], state.z], '高度 ' + state.z);
});

// 点地面定位
let down = null;
cv.addEventListener('pointerdown', e => {
  down = [e.clientX, e.clientY];
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]);
  down = null;
  if (moved > 6) return;
  const r = cv.getBoundingClientRect();
  const p = unproject(e.clientX - r.left, e.clientY - r.top);
  const z = (state.tele && state.tele.ball) ? state.tele.ball[2] : state.z;
  sendGoto([p[0], p[1], z]);
});

const modeBtn = document.getElementById('mode');
modeBtn.addEventListener('click', () => {
  state.mode = state.mode === '2d' ? '3d' : '2d';
  modeBtn.textContent = state.mode === '2d' ? '斜视图' : '俯视图';
  paint();
});

document.getElementById('export').addEventListener('click', e => {
  e.preventDefault();
  exportLog();
});
document.getElementById('clear').addEventListener('click', e => {
  e.preventDefault();
  logs.length = 0;
  renderLog();
});

// ---------------- 启动 ----------------
log('调试台就绪。先开 Blender「指挥」场景，再运行 tools/control_server.py。');
// web/params.json（tools/export_params.py 生成）：锚点/阈值改一处，网页自动跟上
fetch('params.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(p => { if (p && ConsoleCore.applyParams(p)) paint(); })
  .catch(() => {});
renderPanel();
fit();
poll();
})();
</script>
