.controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
input[type=range]{width:100%}
.hint{color:var(--muted);font-size:12px;margin-top:10px}

in": 4.027941044940414}, {"t": 11.9, "ball": [-362.8039767456014, 416.3351436617048, 1470.7458422622021], "hub": [-393.1804759580183, 424.5114820138456, 1627.622914477199], "support": [1, 2, 3, 5], "tensions": [5.9225861111716736, 5.44875499650699, 6.626928895663944, 4.273171245927189], "margin": 4.273171245927189}, {"t": 12.0, "ball": [-424.50324620548287, 426.0049155772119, 1510.6073999003074], "hub": [-400.40299622714537, 406.1559130013865, 1667.5315696375615], "support": [1, 2, 3, 5], "tensions": [5.465126797847399, 5.153204783195043, 6.179064923823498, 2.25425178959849], "margin": 2.25425178959849}]};
const ANCHORS = [[-760.0, 12.0, 1849.0], [780.0, 1100.0, 1760.0], [-300.0, 12.0, 1849.0], [-780.0, 1100.0, 1760.0], [760.0, 12.0, 1670.0], [-808.0, 200.0, 1849.0], [808.0, 500.0, 1760.0], [808.0, 800.0, 1760.0]];
const META = {"hover": {"scenario": "hover", "params_hash": "86d7414498ff", "metrics": {"drift_max_mm": 1.9201132158235203, "drift_rms_mm": 1.920113215790546, "tension_min_n": 2.2998932886919765, "tension_max_n": 2.776957778460317, "slack_s": 0.0, "slack_max_s": 0.0, "switches": 0}, "thresholds": {"drift_max_mm": 5.0, "tension_min_n": 0.3, "tension_max_n": 20.0, "slack_s": 0.0}, "passed": true}, "three": {"scenario": "three_points", "params_hash": "86d7414498ff", "metrics": {"pp_mm": 0.2069818065108565, "settle_s": 1.4154303186856616, "switches": 0, "switch_offset_mm": 0.0}, "thresholds": {"pp_mm": 2.0, "settle_s": 4.5}, "passed": true}, "push": {"scenario": "push", "params_hash": "86d7414498ff", "metrics": {"return_s": 0.41999999999999993, "first_entry_s": 0.39999999999999947, "max_offset_mm": 14.218427005472481, "overshoot_mm": 5.72219163511023, "tension_min_n": 0.0, "tension_max_n": 5.170620641226838, "slack_s": 0.020000000000000462, "slack_max_s": 0.020000000000000462}, "thresholds": {"return_s": 2.0, "max_offset_mm": 80.0, "slack_s": 0.05}, "passed": true}, "spin": {"scenario": "push_spin", "params_hash": "86d7414498ff", "metrics": {"return_s": null, "max_offset_mm": 256.89625695900423, "note": "report only; literal ball-center impulse"}, "thresholds": {}, "passed": null}};
const NAMES = {hover:"悬停 60 s",three:"三点",push:"推一下 0.2 N·s",spin:"球心自旋（只报告）"};
let scene = "hover", time = 0, playing = true, speed = 1, last = 0, iframe = document.getElementById("rig");
const statusEl = document.getElementById("status"), stats = document.getElementById("stats"), note = document.getElementById("note"), timeEl = document.getElementById("time");

function frameAt(t){
  const d = DATA[scene]; if(!d || !d.length) return null;
  const t0 = d[0].t, t1 = d[d.length-1].t;
  const x = Math.min(1, Math.max(0, t));
  const target = t0 + x * (t1 - t0);
  let lo = 0, hi = d.length - 1;
  while(lo < hi){ const mid = (lo + hi) >> 1; if(d[mid].t < target) lo = mid + 1; else hi = mid; }
  let a = d[Math.max(0, lo - 1)], b = d[lo];
  if(!a) a = b; if(!b) b = a;
  const span = b.t - a.t || 1;
  const k = Math.min(1, Math.max(0, (target - a.t) / span));
  const mix = (u, v) => u + (v - u) * k;
  return {
    ball: a.ball.map((v,i)=>mix(v,b.ball[i])),
    hub: a.hub.map((v,i)=>mix(v,b.hub[i])),
    support: b.support, tensions: b.tensions, margin: b.margin,
    anchors: ANCHORS,
  };
}

function post(){
  const f = frameAt(time); if(!f || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage({type:"telemetry", data:f}, "*");
}

function renderStats(){
  const m = META[scene].metrics || {};
  const keys = Object.keys(m).filter(k=>k!=="note");
  const fmt = v => v===null||v===undefined ? "—" : (typeof v === "number" ? Number(v).toFixed(2) : v);
  stats.innerHTML = keys.map(k=>`<div class="stat"><b>${fmt(m[k])}</b><span>${k}</span></div>`).join("");
  note.textContent = m.note || "";
  statusEl.textContent = NAMES[scene] + " · " + (META[scene].passed===true?"PASS":META[scene].passed===false?"FAIL":"report");
  statusEl.className = "badge " + (META[scene].passed===true?"ok":META[scene].passed===false?"bad":"");
}

function tick(now){
  if(!last) last = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if(playing && DATA[scene] && DATA[scene].length){
    const dur = DATA[scene][DATA[scene].length-1].t - DATA[scene][0].t;
    time += (dt * speed) / Math.max(dur, 1e-9);
    if(time > 1) time = 0;
  }
  timeEl.value = String(Math.round(time * 1000));
  post();
  requestAnimationFrame(tick);
}

document.querySelectorAll("button[data-scene]").forEach(btn=>btn.addEventListener("click",()=>{
  scene = btn.dataset.scene; time = 0; last = 0; renderStats();
  document.querySelectorAll("button[data-scene]").forEach(b=>b.classList.toggle("active", b===btn));
  post();
}));
document.querySelectorAll("button[data-speed]").forEach(btn=>btn.addEventListener("click",()=>{
  speed = Number(btn.dataset.speed);
  document.querySelectorAll("button[data-speed]").forEach(b=>b.classList.toggle("active", b===btn));
}));
document.getElementById("play").addEventListener("click", e=>{ playing = !playing; e.target.textContent = playing ? "暂停" : "播放"; });
timeEl.addEventListener("input", e=>{ time = Number(e.target.value)/1000; post(); });
iframe.addEventListener("load", ()=>{ post(); });
renderStats(); post(); requestAnimationFrame(tick);
</script></body></html>
